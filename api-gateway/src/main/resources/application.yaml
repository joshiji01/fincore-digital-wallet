server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/**

            - id: wallet-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/wallets/**

            - id: transaction-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/transactions/**

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}