server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/**

            - id: wallet-service
              uri: http://wallet-service:8082
              predicates:
                - Path=/api/wallets/**

            - id: transaction-service
              uri: http://transaction-service:8083
              predicates:
                - Path=/api/transactions/**

            - id: fincore-ui
              uri: http://fincore-ui:8090
              predicates:
                - Path=/**

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION}

logging:
  level:
    org.springframework.security: INFO